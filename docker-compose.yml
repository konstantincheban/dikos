services:
  dev_api:
    container_name: dikos_api_dev
    image: dikos-api-dev:1.0.0
    environment:
      - PORT=6969
      - NODE_ENV=development
      - MONGO_HOST=mongodb://mongo:27017/dikos
      - JWT_KEY=local-docker-secret
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - shared_data:/forecast
    build:
      context: ./backend
      target: development
      dockerfile: Dockerfile
    command: npm run start:debug
    ports:
      - 6969:6969
      - 9229:9229
    restart: unless-stopped
    depends_on:
      - mongo
      - machine_learning
  machine_learning:
    container_name: machine-learning
    image: dikos-machine-learning:1.0.0
    volumes:
      - shared_data:/forecast
    build:
      context: ./machine_learning
      dockerfile: Dockerfile
    command: python3 main.py
    ports:
      - 4000:4000
    restart: unless-stopped
  mongo:
    image: mongo
    ports:
      - 27017:27017
  dev_ui:
    container_name: dikos_ui_dev
    image: dikos_ui_dev:1.0.0
    environment:
      - API_PROXY_TARGET=http://dev_api:6969/
      - VITE_WS_URL=ws://localhost:6969
    build:
      context: ./frontend
      target: development
      dockerfile: Dockerfile
    command: npm run start:dev
    ports:
      - 3000:3000
    restart: unless-stopped

volumes:
  shared_data:
